[workspace]
members = [
    "crates/elm-magic-macros",
    "crates/elm-magic-egui",
    "crates/elm-magic-gpui",
]

[package]
name = "elm-magic"
version = "0.7.5"
edition = "2021"
description = "State is a variable, events are assignment, the screen is the function body. A lightweight pure-functional UI library disguised as JS/JSX via macros."
license = "MIT"
readme = "README.md"
repository = "https://github.com/jaywoo0830a/elm"
keywords = ["ui", "gui", "jsx", "elm", "macros"]
categories = ["gui", "rust-patterns"]
# 배포 크레이트에서 제외 — 저장소에는 그대로 남는다.
# (버그 리포트는 외부 프로젝트 문서라 크레이트에 담지 않는다.)
exclude = ["/elm-magic-bug-report*.md"]

[dependencies]
elm-magic-macros = { path = "crates/elm-magic-macros", version = "0.7.5" }
# v0.7 "Widget Protocol": `Element`는 위젯 구조체들의 enum이고, `Widget` 트레이트의
# 메서드가 각 variant로 **정적 디스패치**된다. 3개 크레이트에 흩어져 있던 `match`를
# 프로토콜 하나로 모으기 위한 것 — 절차적 매크로라 컴파일타임에만 쓰인다(런타임 비용 0).
enum_dispatch = "0.3"
# 선택적 의존성 — 사양서 8.3의 "뷰는 직렬화 가능"(`Element: Serialize`) 계약.
# 기본 빌드는 여전히 외부 의존성 0 (초경량 유지).
serde = { version = "1", features = ["derive"], optional = true }

[features]
# `--features serde`로 켠다. `Element` / `StyleProps`가 `Serialize`를 얻는다.
serde = ["dep:serde"]

[dev-dependencies]
# 스냅샷 계약 테스트 전용 (사양서 8.3) — 배포 그래프에는 포함되지 않는다.
serde_json = "1"
# P1 품질 테스트 3종 (모두 dev 전용 — `cargo tree -p elm-magic -e normal`은 여전히 0).
# - trybuild: 사양서가 "컴파일 에러"라고 약속한 것들을 `.stderr`로 고정 (tests/compile_fail.rs)
# - proptest: 모델 기반 테스트 — 카운터/리스트/keyed/디바운스/캐스케이드 (tests/properties.rs)
# - insta: 사양서 8.3의 `insta::assert_snapshot!` 계약 (tests/snapshots.rs)
trybuild = "1"
proptest = "1"
insta = { version = "1", features = ["json"] }

[package.metadata.docs.rs]
# 선택 기능(`serde`)까지 문서화한다 — `Element: Serialize`가 docs.rs에 보이도록.
all-features = true

